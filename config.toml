# Настройки поиска лотов на МЭТС (m-ets.ru)
# Пустой список [] или 0 = фильтр не применяется.
# Список всех регионов/категорий/статусов:  python kfc.py --list

[search]
# Фильтры на стороне сайта — как в форме https://m-ets.ru/search

# Текст для поиска: "квартира", "камаз", номер торгов...
keywords = ""
# Исключить лоты, где встречаются эти слова
exclude_words = ["доля", "дебиторская задолженность", "право требования"]

# Название целиком или его часть: "Краснодарский", "Москва", "Ростовская"
regions = []
# "Квартира", "Жилой дом", "Нежилое помещение", "Нежилое здание", "Земельный участок",
# "Легковой автомобиль", "Коммерческий транспорт и спецтехника" ...
categories = []

# "Объявленные торги", "Прием заявок", "Проведение аукциона", "Торги завершены" ...
statuses = ["Объявленные торги", "Прием заявок"]
# "аукцион" и/или "публичное предложение" (на публичке цена снижается по графику)
trade_forms = ["публичное предложение"]
# "банкротство" и/или "коммерческие"
trade_kinds = ["банкротство"]

# Цены в рублях
price_now_from = 0
price_now_to = 0
start_price_from = 0
start_price_to = 0
min_price_from = 0
min_price_to = 0
# На сколько % цена МОЖЕТ упасть по графику (от начальной до минимальной)
max_drop_pct_from = 0
max_drop_pct_to = 0

# Даты в формате ДД.ММ.ГГГГ, пусто — без ограничения
# Начало приёма заявок (первый период торгов), например "01.10.2026"
apps_start_from = ""
apps_start_to = ""
# Конец приёма заявок
apps_end_from = ""
apps_end_to = ""

# Какие лоты сайт отдаёт первыми: new — новые, ending — скоро конец приёма заявок,
# cheap — дешевле, expensive — дороже. Важно, когда смотрим не все лоты
site_sort = "new"


[filter]
# Отбор «по разнице» — после открытия каждого лота

# Текущая цена ниже начальной минимум на N %
min_discount_now_pct = 30
# Разница между начальной и текущей ценой — не меньше N ₽
min_difference_rub = 0
# Подать заявку по текущей цене можно ещё минимум N дней
min_days_left = 0
# Не дороже N ₽ за м² (для недвижимости и земли)
max_price_per_m2 = 0

# Цена в период: самая низкая цена лота по графику между этими датами (ДД.ММ.ГГГГ)
window_from = ""
window_to = ""
# ...и она ниже начальной минимум на N %
min_window_discount_pct = 0
# ...и не дороже N ₽
max_window_price = 0


[run]
# Просмотреть не больше N лотов. 0 — все
max_lots = 0
# Остановиться, когда найдено N подходящих. 0 — искать до конца
stop_after_found = 0
# Открывать каждый лот (нужно для начальной цены и графика снижения)
fetch_details = true
# Лоты берутся из кэша, если открывались не больше N дней назад
cache_days = 7
# Параллельных загрузок и пауза между запросами — не нагружаем сайт
workers = 8
delay_sec = 0.1
# Сортировка: discount_now | difference | price_now | price_per_m2 | deadline | window_min | trade_start
sort_by = "discount_now"
# true — в Excel только новые и подешевевшие с прошлого запуска
only_new = false
output_dir = "output"
